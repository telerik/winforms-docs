# Markdown content replacements
markdown-replacements:
  - pattern: '\{\{source=([^}]+?)\s+region=([^}]+?)\}\}'
    replacement: '<!-- {{source=$1 region=$2}} -->'
  - pattern: '\{\{endregion\}\}'
    replacement: '<!-- {{endregion}} -->'
  - pattern: 'slug:(?!\/|\s)'
    replacement: 'slug://'

